<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文法卡</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #292b2e;
            user-select: none; /* 防止頻繁點擊時選取到文字 */
            cursor: pointer;
        }
        .card {
            background-color: #292b2e;
            padding: 1px 1px;
            border-radius: 16px;
            text-align: center;
            max-width: 98%;
            transition: transform 0.1s ease;
        }
        .card:active {
            transform: scale(0.98);
        }
        /* 第一行大字：現在用來顯示「ます形 / 讀音」 */
        .main-word {
            font-size: 42px;
            font-weight: bold;
            color: #dadde0;
            margin-bottom: 10px;
        }
        /* 第二行文字：現在用來顯示「原形 / 漢字」 */
        .dictionary-form {
            font-size: 42px;
            font-weight: bold;
            color: #97acc2;
            margin-bottom: 15px;
        }
        .meaning {
            font-size: 34px;
            color: #97acc2;
            margin-bottom: 10px;
        }
        .note {
            font-size: 32px;
            color: #97acc2; /* 記憶註解 */
            font-style: italic;
            min-height: 24px;
        }
        .hint {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            color: #bdc3c7;
        }
    </style>
</head>

        <div class="note" id="note"></div>
