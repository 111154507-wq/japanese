    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N5 單字隨機抽卡</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f6f8;
            user-select: none; /* 防止頻繁點擊時選取到文字 */
            cursor: pointer;
        }
        .card {
            background: white;
            padding: 50px 80px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 80%;
            transition: transform 0.1s ease;
        }
        .card:active {
            transform: scale(0.98);
        }
        /* 第一行大字：現在用來顯示「ます形 / 讀音」 */
        .main-word {
            font-size: 72px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        /* 第二行文字：現在用來顯示「原形 / 漢字」 */
        .dictionary-form {
            font-size: 72px;
            font-weight: bold;
            color: #008080;
            margin-bottom: 15px;
        }
        .meaning {
            font-size: 24px;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        .note {
            font-size: 22px;
            color: #a9a9a9; /* 記憶註解 */
            font-style: italic;
            min-height: 24px;
        }
        .hint {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            color: #bdc3c7;
        }
    </style>
</head>

            const randomIndex = Math.floor(Math.random() * vocabList.length);
            const word = vocabList[randomIndex];

            // 關鍵修改：將 word[1]（ます形/讀音）放到大字區塊；word[0]（辭書形/漢字）放到第二行
            document.getElementById('mainWord').innerText = word[1]; 
            document.getElementById('dictForm').innerText = word[0];
            document.getElementById('meaning').innerText = word[2];
            document.getElementById('note').innerText = word[3] || "";
        }

        document.addEventListener('click', nextWord);

        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                nextWord();
            }
